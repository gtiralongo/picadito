{% extends "base.html" %}
{% block title %}Crear picadito &mdash; Picadito{% endblock %}
{% block content %}
<section class="form-section">
    <h1>Crear picadito</h1>
    <form method="POST" action="/crear" class="event-form">
        <div class="field">
            <label for="creator_name">Tu nombre</label>
            <input type="text" id="creator_name" name="creator_name" required placeholder="Ej: Martín">
        </div>
        <div class="field">
            <label for="title">Nombre del evento</label>
            <input type="text" id="title" name="title" required placeholder="Ej: Picadito sábado en la Catedral">
        </div>
        <div class="field">
            <label for="date">Fecha y hora</label>
            <input type="datetime-local" id="date" name="date" required>
        </div>
        <div class="field">
            <label for="location">Lugar</label>
            <input type="text" id="location" name="location" placeholder="Ej: Club Atlético, Cancha 3">
        </div>
        <div class="field">
            <label for="max_participants">Cupo máximo <span class="optional">(0 = sin límite)</span></label>
            <input type="number" id="max_participants" name="max_participants" min="0" value="0">
        </div>
        <div class="field">
            <label for="description">Descripción <span class="optional">(opcional)</span></label>
            <textarea id="description" name="description" rows="3" placeholder="Ej: Llevar pecheras, agua y buena onda"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Crear evento</button>
    </form>
</section>
{% endblock %}
