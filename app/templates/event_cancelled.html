{% extends "base.html" %}
{% block title %}{{ event.title }} &mdash; Picadito{% endblock %}
{% block content %}
<section class="event-cancelled">
    <div class="cancelled-box">
        <h1>❌ {{ event.title }}</h1>
        <p>Este evento fue cancelado.</p>
        {% if event.description %}
        <p>{{ event.description }}</p>
        {% endif %}
    </div>
</section>
{% endblock %}
