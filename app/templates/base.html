<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16a34a">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <title>{% block title %}Picadito{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">⚽ Picadito</a>
            <nav class="nav">
                <button id="dark-toggle" class="btn-icon" aria-label="Modo oscuro">🌙</button>
                {% if user %}
                <a href="/dashboard" class="nav-link">{{ user.name }}</a>
                <form method="POST" action="/logout" class="inline-form">
                    <button type="submit" class="btn-link">Salir</button>
                </form>
                {% else %}
                <a href="/login" class="nav-link">Ingresar</a>
                <a href="/registro" class="nav-link nav-registro">Crear cuenta</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Picadito &mdash; armá el equipo sin vueltas</p>
    </footer>

    <script src="/static/js/app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/sw.js");
        }
    </script>
</body>
</html>
